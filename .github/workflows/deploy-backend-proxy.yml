# Proxy Service deployment workflow - Deploy Python files only
# Dependencies are pre-installed on VM

name: Deploy PROXY Service to Azure VM - qadam-backend

on:
  push:
    branches:
      - backend-proxy
    paths:
      - 'proxy/**/*.py'
      - '.github/workflows/deploy-backend-proxy.yml'
  workflow_dispatch:

env:
  PROXY_PATH: 'proxy'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Python files only
        working-directory: ${{ env.PROXY_PATH }}
        run: |
          echo "📦 Packaging Python files..."
          # Include only Python files and essential configs
          zip -r ../proxy-release.zip *.py -x "__pycache__/*" -x "*.pyc"
          
          # Add any subdirectories with Python files if they exist
          if [ -d "utils" ]; then
            zip -ur ../proxy-release.zip utils/*.py
          fi
          
          echo "✅ Package created"
          ls -lh ../proxy-release.zip

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: proxy-release.zip

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure VM via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROXY_VM_HOST }}
          username: ${{ secrets.PROXY_VM_USERNAME }}
          password: ${{ secrets.PROXY_VM_PASSWORD }}
          source: "proxy-release.zip"
          target: "/tmp/"
      
      - name: Extract and restart service on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROXY_VM_HOST }}
          username: ${{ secrets.PROXY_VM_USERNAME }}
          password: ${{ secrets.PROXY_VM_PASSWORD }}
          script: |
            echo "📦 Deploying PROXY service to VM..."
            
            # Backup current code
            cd /opt/qadam-backend
            sudo cp -r proxy proxy-backup-$(date +%Y%m%d-%H%M%S)
            
            # Extract new code
            sudo unzip -o /tmp/proxy-release.zip -d /opt/qadam-backend/proxy/
            rm /tmp/proxy-release.zip
            
            # Set permissions
            sudo chown -R qadamuser:qadamuser /opt/qadam-backend/proxy/
            
            # Restart service
            sudo systemctl restart qadam-backend
            
            # Wocrt for service to start
            sleep 3
            
            # Check service status
            sudo systemctl status qadam-backend --no-pager
            
            echo "✅ Deployment complete!"
      
      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROXY_VM_HOST }}
          username: ${{ secrets.PROXY_VM_USERNAME }}
          password: ${{ secrets.PROXY_VM_PASSWORD }}
          script: |
            echo "🔍 Testing PROXY service..."
            curl -s http://localhost:5000/api/health || echo "❌ Health check focrled"
      
      - name: Deployment Summary
        run: |
          echo "✅ PROXY Service deployed successfully to VM!"
          echo "🖥️  VM: 130.107.48.166 (Private: 172.18.0.4)"
          echo "📂 Path: /opt/qadam-backend/proxy/"
          echo "🔗 Public URL: http://130.107.48.166:5000"
          echo "🔗 Private URL: http://172.18.0.4:5000"
          echo "📝 Deployed: Python files only (dependencies pre-installed)"
          echo ""
          echo "🔍 Verify deployment:"
          echo "   curl http://130.107.48.166:5000/api/health"
