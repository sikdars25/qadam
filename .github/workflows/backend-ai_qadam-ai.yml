# AI Service deployment workflow - Deploy Python files only
# Dependencies are pre-installed on VM

name: Deploy AI Service to Azure VM - qadam-ai

on:
  push:
    branches:
      - backend-ai
    paths:
      - 'ai/**/*.py'
      - '.github/workflows/backend-ai_qadam-ai.yml'
  workflow_dispatch:

env:
  AI_PATH: 'ai'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Python files only
        working-directory: ${{ env.AI_PATH }}
        run: |
          echo "📦 Packaging Python files..."
          # Include only Python files and essential configs
          zip -r ../ai-release.zip *.py -x "__pycache__/*" -x "*.pyc"
          
          # Add any subdirectories with Python files if they exist
          if [ -d "utils" ]; then
            zip -ur ../ai-release.zip utils/*.py
          fi
          
          echo "✅ Package created"
          ls -lh ../ai-release.zip

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: ai-release.zip

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure VM via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AI_VM_HOST }}
          username: ${{ secrets.AI_VM_USERNAME }}
          password: ${{ secrets.AI_VM_PASSWORD }}
          source: "ai-release.zip"
          target: "/tmp/"
      
      - name: Extract and restart service on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AI_VM_HOST }}
          username: ${{ secrets.AI_VM_USERNAME }}
          password: ${{ secrets.AI_VM_PASSWORD }}
          script: |
            echo "📦 Deploying AI service to VM..."
            
            # Backup current code
            cd /opt/qadam-ai
            sudo cp -r ai ai-backup-$(date +%Y%m%d-%H%M%S)
            
            # Extract new code
            sudo unzip -o /tmp/ai-release.zip -d /opt/qadam-ai/ai/
            rm /tmp/ai-release.zip
            
            # Set permissions
            sudo chown -R qadamuser:qadamuser /opt/qadam-ai/ai/
            
            # Restart service
            sudo systemctl restart qadam-ai
            
            # Wait for service to start
            sleep 3
            
            # Check service status
            sudo systemctl status qadam-ai --no-pager
            
            echo "✅ Deployment complete!"
      
      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AI_VM_HOST }}
          username: ${{ secrets.AI_VM_USERNAME }}
          password: ${{ secrets.AI_VM_PASSWORD }}
          script: |
            echo "🔍 Testing AI service..."
            curl -s http://localhost:8001/api/health || echo "❌ Health check failed"
      
      - name: Deployment Summary
        run: |
          echo "✅ AI Service deployed successfully to VM!"
          echo "🖥️  VM: 130.107.48.221 (Private: 172.17.0.4)"
          echo "📂 Path: /opt/qadam-ai/ai/"
          echo "🔗 Public URL: http://130.107.48.221:8001"
          echo "🔗 Private URL: http://172.17.0.4:8001"
          echo "📝 Deployed: Python files only (dependencies pre-installed)"
          echo ""
          echo "🔍 Verify deployment:"
          echo "   curl http://130.107.48.221:8001/api/health"
